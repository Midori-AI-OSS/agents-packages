---
name: "HuggingFace Agent Integration Test"

'on':
  push:
    branches:
      - main
    paths:
      - 'midori-ai-agent-huggingface/**'
      - '.github/workflows/test-huggingface-integration.yml'
  pull_request:
    paths:
      - 'midori-ai-agent-huggingface/**'
      - '.github/workflows/test-huggingface-integration.yml'
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6.6.0
        with:
          python-version: '3.12'

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: >-
            ${{ runner.os }}-huggingface-deepscaler-1.5b-${{
            hashFiles('midori-ai-agent-huggingface/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-huggingface-deepscaler-1.5b-
            ${{ runner.os }}-huggingface-

      - name: Install midori-ai-agent-huggingface with dependencies
        run: |
          cd midori-ai-agent-huggingface
          uv sync --all-extras

      - name: Run integration test
        id: run-test
        run: |
          cd midori-ai-agent-huggingface
          uv run python tests/integration_test.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Report test status
        if: always()
        run: |
          if [ "${{ steps.run-test.outcome }}" == "success" ]; then
            echo "✓ Integration test passed successfully"
          else
            echo "✗ Integration test failed"
            exit 1
          fi
